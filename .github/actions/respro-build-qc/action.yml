name: respro build QC
description: |
  Install ResistanceProfiler from a GitHub release tag (no conda, no autobump
  of a pinned version) and run the build quality-control step against a
  converted database's output artifacts. Used by both the autobump workflows
  and the PR-triggered build-check workflow so every build is validated
  against the same respro version.

inputs:
  source-name:
    description: Source database name (e.g. stanford-hiv). Passed to respro as the project name.
    required: true
  output-dir:
    description: Directory containing rules.tsv / metadata.json / formula-rules.tsv.
    required: true
  work-dir:
    description: Working directory for GenBank fetch + built .db + logs.
    required: false
    default: /tmp/respro_qc
  respro-version:
    description: |
      ResistanceProfiler version to build from. Defaults to "latest", which
      resolves the newest tag on the the-foxlab/ResistanceProfiler repository
      at run time. Set to a concrete tag (e.g. "v0.1.3") to pin a specific
      release.
    required: false
    default: latest

outputs:
  qc_failed:
    description: '"true" when the respro build QC reported a hard failure, otherwise "false".'
    value: ${{ steps.qc_summary.outputs.qc_failed }}
  summary:
    description: 'Multi-line markdown summary of the build QC, suitable for PR bodies.'
    value: ${{ steps.qc_summary.outputs.block }}

runs:
  using: composite

  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Resolve latest respro release tag
      if: inputs.respro-version == 'latest'
      id: respro_tag
      shell: bash
      run: |
        set -euo pipefail
        # Fetch the newest non-web tag from the ResistanceProfiler repo.
        # Tags are prefixed with "v" (e.g. v0.1.3); web releases use "web-v".
        tag=$(curl -fsSL \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/the-foxlab/ResistanceProfiler/tags" \
          | python -c '
        import json, sys
        tags = json.load(sys.stdin)
        for t in tags:
            name = t.get("name", "")
            if name.startswith("v") and not name.startswith("web-"):
                print(name)
                break
        else:
            sys.exit("No non-web respro release tag found")
        ')
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        echo "Resolved latest respro release tag: ${tag}"

    - name: Determine respro version
      id: respro_version
      shell: bash
      run: |
        if [ "${{ inputs.respro-version }}" = "latest" ]; then
          echo "version=${{ steps.respro_tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
        else
          echo "version=${{ inputs.respro-version }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Install respro from release tag
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        # Build from the tagged source tarball. The runner has a C compiler
        # so the mappy native dependency builds from source without conda.
        version="${{ steps.respro_version.outputs.version }}"
        echo "Installing ResistanceProfiler ${version} from source"
        python -m pip install \
          "respro @ git+https://github.com/the-foxlab/ResistanceProfiler.git@${version}"
        respro --version

    - name: respro build QC
      id: respro_qc
      shell: bash
      continue-on-error: true
      run: |
        python scripts/respro_build_qc.py \
          --source-name "${{ inputs.source-name }}" \
          --output-dir "${{ inputs.output-dir }}" \
          --work-dir "${{ inputs.work-dir }}"
        echo "qc_exit=$?" >> "$GITHUB_OUTPUT"

    - name: Read respro QC summary
      id: qc_summary
      shell: bash
      run: |
        summary_path="${{ inputs.work-dir }}/qc_summary.md"
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "block<<${EOF}" >> "$GITHUB_OUTPUT"
        qc_failed="false"
        if [ ! -f "$summary_path" ]; then
          # The QC script exited before writing a summary (infrastructure
          # error: crash, missing respro, import failure). Emit a synthetic
          # failure block so the PR comment still renders and the workflow
          # fails cleanly via qc_failed=true.
          echo "## respro build QC" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "**Source:** \`${{ inputs.source-name }}\`" >> "$GITHUB_OUTPUT"
          echo "**Status:** ⚠️ **\`respro init\` FAILED** — the QC step did not produce a summary (infrastructure error before QC ran)." >> "$GITHUB_OUTPUT"
          echo "**Exit code:** \`unknown\`" >> "$GITHUB_OUTPUT"
          qc_failed="true"
        else
          cat "$summary_path" >> "$GITHUB_OUTPUT"
          if [ -f "${{ inputs.work-dir }}/qc_summary.json" ]; then
            status=$(python -c "import json;print(json.load(open('${{ inputs.work-dir }}/qc_summary.json'))['status'])" 2>/dev/null || echo "")
            if [ "$status" = "failed" ]; then qc_failed="true"; fi
          fi
        fi
        echo "${EOF}" >> "$GITHUB_OUTPUT"
        echo "qc_failed=${qc_failed}" >> "$GITHUB_OUTPUT"
