name: CHARMD Autobump

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-charmd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve latest upstream source
        id: source
        run: |
          set -euo pipefail
          project_id="vtilloy%2Fcharmd-data-db"
          file_path="charmd-data.tsv"
          branch="master"

          # Get latest commit timestamp for the file via GitLab API.
          # The converter runs with --source-date so metadata maintainer_update
          # tracks the upstream data version, not the workflow run date.
          api_url="https://gitlab.com/api/v4/projects/${project_id}/repository/commits?path=${file_path}&ref_name=${branch}"
          response=$(curl -fsSL "$api_url")
          commit_date=$(echo "$response" | jq -r '.[0].committed_date' | cut -d'T' -f1)
          commit_sha=$(echo "$response" | jq -r '.[0].id')

          raw_url="https://gitlab.com/vtilloy/charmd-data-db/-/raw/${branch}/${file_path}"

          {
            echo "source_url=$raw_url"
            echo "source_commit_date=$commit_date"
            echo "source_commit_sha=$commit_sha"
          } >> "$GITHUB_OUTPUT"

          echo "Source URL: $raw_url"
          echo "Source Commit Date: $commit_date"
          echo "Source Commit SHA: $commit_sha"

      - name: Compare with current tracked source
        id: update_check
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys

          latest = "${{ steps.source.outputs.source_commit_date }}"
          metadata_path = "databases/charmd/output/metadata.json"

          current = ""
          if os.path.exists(metadata_path):
              with open(metadata_path, "r", encoding="utf-8") as fh:
                  metadata = json.load(fh)
              current = str(metadata.get("maintainer_update", "")).strip()
          else:
              print("Note: metadata.json does not exist (first run?)", file=sys.stderr)

          print(f"Current source date: '{current}'", file=sys.stderr)
          print(f"Latest source date:  '{latest}'", file=sys.stderr)

          should_update = "true" if latest and latest != current else "false"

          print(f"Update required: {should_update}", file=sys.stderr)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"current_source_date={current}\n")
              fh.write(f"should_update={should_update}\n")
          PY

      - name: Run converter
        if: steps.update_check.outputs.should_update == 'true'
        run: |
          # The converter self-resolves the source date via the GitLab API
          # (same call as the resolve step above) and fetches the default
          # SOURCE_URL when --source-url is omitted.
          python databases/charmd/scripts/convert.py \
            --output-dir databases/charmd/output

      - name: Build global metadata manifest
        if: steps.update_check.outputs.should_update == 'true'
        run: |
          python scripts/build_metadata_manifest.py

      - name: respro build QC
        id: qc
        if: steps.update_check.outputs.should_update == 'true'
        uses: ./.github/actions/respro-build-qc
        with:
          source-name: charmd
          output-dir: databases/charmd/output
          work-dir: /tmp/respro_qc

      - name: No update detected
        if: steps.update_check.outputs.should_update != 'true'
        run: |
          echo "No new upstream source detected; skipping converter and PR creation."

      - name: Create pull request
        if: steps.update_check.outputs.should_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: autobump/charmd
          delete-branch: true
          commit-message: "chore(charmd): autobump source outputs"
          title: "chore: autobump charmd outputs"
          body: |
            Automated monthly update for CHARMD source data.

            - Previous source date: ${{ steps.update_check.outputs.current_source_date }}
            - Source commit date: ${{ steps.source.outputs.source_commit_date }}
            - Source commit SHA: ${{ steps.source.outputs.source_commit_sha }}
            - Source URL: ${{ steps.source.outputs.source_url }}

            ${{ steps.qc.outputs.summary }}

            This PR was generated by the autobump workflow.
          labels: autobump
          add-paths: |
            databases/charmd/output/rules.tsv
            databases/charmd/output/metadata.json
            databases/charmd/output/non-migrated-rules.txt
            databases/manifest.json

      - name: Mark workflow failed on respro build error
        if: steps.update_check.outputs.should_update == 'true' && steps.qc.outputs.qc_failed == 'true'
        run: |
          echo "respro build QC failed for charmd; see the PR body and the 'respro build QC' step log."
          exit 1
